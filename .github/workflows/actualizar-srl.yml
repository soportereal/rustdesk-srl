# Compila «Soporte Remoto Factupos» a partir de una versión OFICIAL de RustDesk (#2942, 18-oct-2026).
#
#   RustDesk oficial (tag) ──► srl-marca/aplicar.sh (la receta) ──► puente ──► Linux .deb / Windows .msi
#
# Lo dispara el vigía del .11 (o a mano: Actions → este workflow → Run workflow → versión).
# Las versiones de Flutter / Rust / vcpkg / generador del puente salen de ESA versión oficial,
# así que no hay que tocarlas a mano cuando RustDesk las cambia.
name: Compilar Soporte Remoto Factupos

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión OFICIAL de RustDesk (tag), ej. 1.5.0"
        required: true
      windows:
        description: "Compilar también Windows (.msi)"
        type: boolean
        default: true

run-name: Soporte Remoto Factupos ${{ inputs.version }}

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  preparar:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      flutter: ${{ steps.v.outputs.flutter }}
      flutter_bridge: ${{ steps.v.outputs.flutter_bridge }}
      bridge: ${{ steps.v.outputs.bridge }}
      cargo_expand: ${{ steps.v.outputs.cargo_expand }}
      rust: ${{ steps.v.outputs.rust }}
      vcpkg: ${{ steps.v.outputs.vcpkg }}
    steps:
      - name: Receta (este repo)
        uses: actions/checkout@v4
        with:
          path: srl

      - name: RustDesk oficial ${{ inputs.version }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.version }}
          submodules: recursive
          path: code

      - name: Aplicar la marca (se frena si algo no calza)
        run: bash srl/srl-marca/aplicar.sh code

      - name: Versiones de herramientas de ESA versión oficial
        id: v
        run: |
          W=code/.github/workflows
          val() { grep -m1 -E "^\s+$1:" "$2" | sed -E 's/^[^:]+:[[:space:]]*"?([^" #]+)"?.*/\1/'; }
          {
            echo "version=$(val VERSION $W/flutter-build.yml)"
            echo "flutter=$(val FLUTTER_VERSION $W/flutter-build.yml)"
            echo "rust=$(val RUST_VERSION $W/flutter-build.yml)"
            echo "vcpkg=$(val VCPKG_COMMIT_ID $W/flutter-build.yml)"
            echo "bridge=$(val FLUTTER_RUST_BRIDGE_VERSION $W/bridge.yml)"
            echo "cargo_expand=$(val CARGO_EXPAND_VERSION $W/bridge.yml)"
            echo "flutter_bridge=$(grep -m1 -E 'flutter-version: "' $W/bridge.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          } | tee -a "$GITHUB_OUTPUT"
          V=$(val VERSION $W/flutter-build.yml)
          [ "$V" = "${{ inputs.version }}" ] || { echo "❌ el código dice versión $V y se pidió ${{ inputs.version }}"; exit 1; }

      - name: Empaquetar el código con la marca
        run: tar czf codigo.tgz --exclude=.git -C code .

      - uses: actions/upload-artifact@v4
        with:
          name: codigo-con-marca
          path: codigo.tgz
          retention-days: 3

  puente:
    needs: preparar
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codigo-con-marca
      - run: mkdir code && tar xzf codigo.tgz -C code && rm codigo.tgz

      - name: Dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.preparar.outputs.rust }}
          components: rustfmt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.preparar.outputs.flutter_bridge }}
          channel: stable

      - name: Generador del puente
        working-directory: code
        run: |
          [ -n "${{ needs.preparar.outputs.cargo_expand }}" ] && cargo install cargo-expand --version ${{ needs.preparar.outputs.cargo_expand }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ needs.preparar.outputs.bridge }} --features "uuid" --locked
          # mismo ajuste que hace RustDesk oficial al generar con Flutter 3.22.3
          if [ "${{ needs.preparar.outputs.flutter_bridge }}" = "3.22.3" ]; then
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          fi
          cd flutter && flutter pub get

      - name: Generar el puente
        working-directory: code
        run: |
          mkdir -p flutter/macos/Runner
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v4
        with:
          name: puente
          retention-days: 3
          path: |
            code/src/bridge_generated.rs
            code/src/bridge_generated.io.rs
            code/flutter/lib/generated_bridge.dart
            code/flutter/lib/generated_bridge.freezed.dart

  linux:
    needs: [preparar, puente]
    runs-on: ubuntu-22.04
    steps:
      - name: Exportar la caché de GitHub Actions (vcpkg)
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/download-artifact@v4
        with:
          name: codigo-con-marca
      - run: mkdir code && tar xzf codigo.tgz -C code && rm codigo.tgz
      - uses: actions/download-artifact@v4
        with:
          name: puente
          path: code

      - name: Dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl g++ gcc git libasound2-dev libayatana-appindicator3-dev libclang-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpam0g-dev libpulse-dev libssl-dev libva-dev libvdpau-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev nasm ninja-build pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.preparar.outputs.rust }}
          components: rustfmt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.preparar.outputs.flutter }}
          channel: stable

      - name: Parche de Flutter que aplica RustDesk oficial
        run: |
          P=code/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          if [ "${{ needs.preparar.outputs.flutter }}" = "3.24.5" ] && [ -f "$P" ]; then
            cd "$FLUTTER_ROOT" && git apply "$GITHUB_WORKSPACE/$P" && echo "parche aplicado"
          fi

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ needs.preparar.outputs.vcpkg }}

      - name: Dependencias vcpkg
        working-directory: code
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
        run: $VCPKG_ROOT/vcpkg install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"

      - name: Compilar
        working-directory: code
        run: python3 build.py --flutter

      - name: Comprobar el paquete
        working-directory: code
        run: |
          DEB=$(ls rustdesk-*.deb | head -1)
          [ -n "$DEB" ] || { echo "❌ no salió el .deb"; exit 1; }
          V=$(dpkg-deb -f "$DEB" Version)
          [ "$V" = "${{ inputs.version }}" ] || { echo "❌ el .deb es $V"; exit 1; }
          mkdir x && dpkg-deb -x "$DEB" x
          strings x/usr/share/rustdesk/lib/librustdesk.so | grep -q remote.factupos.com || { echo "❌ sin el servidor"; exit 1; }
          strings x/usr/share/rustdesk/lib/librustdesk.so | grep -q "Soporte Remoto Factupos" || { echo "❌ sin el nombre"; exit 1; }
          grep -q "^Name=Soporte Remoto Factupos$" x/usr/share/applications/rustdesk.desktop || { echo "❌ lanzador"; exit 1; }
          mv "$DEB" "../SoporteRemoto-Factupos-${V}-x86_64.deb"
          echo "✅ SoporteRemoto-Factupos-${V}-x86_64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: SoporteRemoto-Factupos-${{ inputs.version }}-linux-deb
          path: SoporteRemoto-Factupos-*.deb

  windows:
    if: ${{ inputs.windows }}
    needs: [preparar, puente]
    runs-on: windows-2022
    steps:
      - name: Exportar la caché de GitHub Actions (vcpkg)
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/download-artifact@v4
        with:
          name: codigo-con-marca
      - shell: bash
        run: mkdir code && tar xzf codigo.tgz -C code && rm codigo.tgz
      - uses: actions/download-artifact@v4
        with:
          name: puente
          path: code

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.preparar.outputs.rust }}
          targets: x86_64-pc-windows-msvc

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.preparar.outputs.flutter }}
          channel: stable

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ needs.preparar.outputs.vcpkg }}

      - name: Dependencias vcpkg
        shell: bash
        working-directory: code
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Compilar
        shell: bash
        working-directory: code
        run: python3 build.py --flutter

      - uses: microsoft/setup-msbuild@v2

      - name: Preparar el MSI (binario con el nombre de la app)
        shell: bash
        working-directory: code
        run: |
          mkdir -p rustdesk
          cp -r flutter/build/windows/x64/runner/Release/* rustdesk/
          mv "rustdesk/rustdesk.exe" "rustdesk/Soporte Remoto Factupos.exe"
          cd res/msi
          # preprocess.py llama al binario con shell=True: el nombre con espacios hay que citarlo
          python -c "
          src = open('preprocess.py').read()
          src = src.replace('f\"{dist_app} {args}\"', 'f\"\\\\\"{dist_app}\\\\\" {args}\"')
          open('preprocess.py','w').write(src)
          "
          python preprocess.py --arp -d ../../rustdesk --app-name "Soporte Remoto Factupos" -v ${{ inputs.version }}

      - name: Compilar el MSI
        shell: pwsh
        working-directory: code/res/msi
        run: |
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Renombrar el MSI
        shell: bash
        run: mv code/res/msi/Package/bin/x64/Release/en-us/Package.msi ./SoporteRemoto-Factupos-${{ inputs.version }}-x86_64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: SoporteRemoto-Factupos-${{ inputs.version }}-windows-msi
          path: SoporteRemoto-Factupos-*.msi
