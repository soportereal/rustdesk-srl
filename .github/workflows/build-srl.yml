name: Build Soporte Remoto SRL

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.0"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked

      - name: Flutter pub get
        run: |
          cd $GITHUB_WORKSPACE/flutter
          flutter pub get

      - name: Generate bridge
        run: |
          cd $GITHUB_WORKSPACE
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart

      - name: Upload bridge
        uses: actions/upload-artifact@v4
        with:
          name: bridge-files
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  build-linux:
    needs: generate-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Export GitHub Actions cache
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-files

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl g++ gcc git libayatana-appindicator3-dev libclang-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpam0g-dev libpulse-dev libva-dev libvdpau-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev nasm ninja-build pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b

      - name: Install vcpkg dependencies (manifest mode)
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"

      - name: Build
        run: python3 build.py --flutter

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: SoporteRemoto-SRL-linux-x86_64.deb
          path: ./rustdesk-*.deb

  build-windows:
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-files

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b

      - name: Install vcpkg dependencies (manifest mode)
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build
        shell: bash
        run: python3 build.py --flutter

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: SoporteRemoto-SRL-windows-x86_64
          path: |
            ./flutter/build/windows/x64/runner/Release/**/*

      # ---- MSI installer (WiX) ----
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Stage MSI files (renombrar binario a Soporte Remoto SRL.exe)
        shell: bash
        run: |
          mkdir -p rustdesk
          cp -r flutter/build/windows/x64/runner/Release/* rustdesk/
          # Renombrar el binario para que coincida con APP_NAME del codigo
          # (config.rs APP_NAME = "Soporte Remoto SRL"). Asi el MSI instala
          # con el nombre correcto y el binario no pide re-instalarse.
          mv "rustdesk/rustdesk.exe" "rustdesk/Soporte Remoto SRL.exe"
          ls -la "rustdesk/Soporte Remoto SRL.exe"

      - name: Preprocess MSI (WiX wxs files)
        shell: bash
        run: |
          cd res/msi
          # preprocess.py llama al binario para --version y --build-date con
          # subprocess.Popen(f"{dist_app} {args}", shell=True). Los espacios en
          # "Soporte Remoto SRL.exe" rompen el shell. Patch: quotear dist_app.
          python -c "
          import re
          src = open('preprocess.py').read()
          src = src.replace('f\"{dist_app} {args}\"', 'f\"\\\\\"{dist_app}\\\\\" {args}\"')
          open('preprocess.py','w').write(src)
          "
          grep "dist_app" preprocess.py | head -3
          python preprocess.py --arp -d ../../rustdesk --app-name "Soporte Remoto SRL" -v 1.4.6

      - name: Build MSI
        shell: pwsh
        run: |
          cd res/msi
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Rename MSI
        shell: bash
        run: |
          mv res/msi/Package/bin/x64/Release/en-us/Package.msi ./SoporteRemoto-SRL-1.4.6-x86_64.msi
          ls -la SoporteRemoto-SRL-*.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SoporteRemoto-SRL-windows-installer
          path: ./SoporteRemoto-SRL-*.msi
